<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/Style.css">
    <title>Registro - Maskot</title>
    <link rel="icon" href="../img/Logo.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">

</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-maskot">
            <div class="container">
                <a href="../Maskot.html" class="navbar-brand d-flex align-items-center gap-2">
                    <img src="../img/Logo.png" alt="Logo Maskot" class="logo">
                    <span class="marca">Maskot</span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-3">
                        <li class="nav-item"><a class="nav-link opcion-menu" href="../Maskot.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link opcion-menu"
                                href="../Servicios/Servicios.html">Servicios</a></li>
                        <li class="nav-item"><a class="nav-link opcion-menu"
                                href="../Maskot.html#contacto">Contáctanos</a>
                        </li>
                        <li class="nav-item">
                            <button class="btn btn-login-nav" data-bs-toggle="modal"
                                data-bs-target="#loginModal">Login</button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-login">
                <div class="modal-header border-0">
                    <h2 class="modal-title w-100 text-center">Iniciar Sesión</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="Ingrese su email" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password"
                                placeholder="Ingrese su contraseña" required>
                        </div>

                        <button type="submit" class="btn btn-login w-100">Ingresar</button>

                        <div class="d-flex justify-content-between mt-3">
                            <a href="#" class="link-login">¿Olvidó su contraseña?</a>
                            <a href="../Registro/registro.html" class="link-login">Regístrese</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <section class="banner-registro">
        <h1>Crear Cuenta</h1>
        <p>Únete a la familia Maskot</p>
    </section>

    <main>
        <section class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card tarjeta p-4">
                        <h2 class="text-center mb-4" style="color: var(--rojo); font-weight: 700;">Registro</h2>
                        <form id="registroForm">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre completo</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Tu nombre"
                                    minlength="3" maxlength="50" required>
                            </div>
                            <div class="mb-3">
                                <label for="emailReg" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="emailReg" placeholder="correo@ejemplo.com"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" id="telefono" placeholder="300 123 4567"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label for="passReg" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="passReg"
                                    placeholder="Mínimo 6 caracteres" minlength="6" required>
                            </div>
                            <div class="mb-4">
                                <label for="passConf" class="form-label">Confirmar contraseña</label>
                                <input type="password" class="form-control" id="passConf"
                                    placeholder="Repite la contraseña" minlength="6" required>
                            </div>

                            <button type="submit" class="btn btn-login w-100">Crear cuenta</button>

                            <div class="text-center mt-3">
                                <a href="../Maskot.html" class="link-login">¿Ya tienes cuenta? Inicia sesión</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <script src="../js/registro.js"></script>
</body>

</html>
